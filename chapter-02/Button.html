<!DOCTYPE html>
<html>
<head>
    <title>Button Practice</title>
    <style>
        .subscribe-button {
            background-color: rgb(200, 0, 0);
            color: white;
            border: none;
            height: 35px;
            width: 105px;
            border-radius: 2px;
            cursor: pointer;
            margin-right: 8px;
        }
        .join-button {
            background-color: white;
            color: rgb(41, 118, 211);
            height: 35px;
            width: 62px;
            border-color: rgb(41, 118, 211);
            border-style: solid;
            border-width: 1px;
            border-radius: 2px;
            cursor: pointer
        }
        .tweet-button {
            background-color: rgb(2, 158, 255);
            height: 36px;
            width: 75px;
            border-color: rgb(2, 158, 255);
            color: white;
            border-style: solid;
            font-size: 15px;
            border: none;
            border-radius: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <button class="subscribe-button">SUBSCRIBE</button>
    <button class="join-button">JOIN</button>
    <button class="tweet-button">Tweet</button>
</body>
</html>
